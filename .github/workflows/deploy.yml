name: Auto Deploy on Version Change
on:
  push:
    branches: [ master ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: Check version change
        id: check_version
        run: |
          OLD_VERSION=$(git show HEAD~1:pom.xml | grep -A 0 -B 0 "<version>" | head -1 | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/')
          NEW_VERSION=$(grep -A 0 -B 0 "<version>" pom.xml | head -1 | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/')
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "VERSION_CHANGED=true" >> $GITHUB_ENV
            echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "IMAGE_NAME=SpringCloud" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.VERSION_CHANGED == 'true'
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        if: env.VERSION_CHANGED == 'true'
        run: |
          mvn clean install -DskipTests

      - name: Set up Docker Buildx
        if: env.VERSION_CHANGED == 'true'
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        if: env.VERSION_CHANGED == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: env.VERSION_CHANGED == 'true'
        run: |
          mvn dockerfile:build dockerfile:push
          
      - name: Deploy to server
        if: env.VERSION_CHANGED == 'true'
        run: |
          echo "Deployment would happen here"
          echo "Image pushed to: ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ env.VERSION }}"
          # 在实际环境中，您需要配置 SSH 密钥并添加类似下面的命令：
          # ssh user@your-server "docker pull ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ env.VERSION }} && \
          # docker stop app-container && \
          # docker run --name app-container -d ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${{ env.VERSION }}"